name: ras_candidate_mobile
description: "RAS Candidate Mobile Application connected to the RAS backend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & HTTP
  dio: ^5.4.3+1

  # Routing & Navigation
  go_router: ^14.1.4

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Device, Camera & Files
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  camera: ^0.10.5+9
  permission_handler: ^11.3.1

  # Local Notifications & Sockets
  flutter_local_notifications: ^17.1.2
  socket_io_client: ^2.0.3+1

  # UI, Fonts & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
