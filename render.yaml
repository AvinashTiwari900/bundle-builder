databases:
  - name: ras-db
    plan: free
    region: oregon
    databaseName: ras
    user: ras

services:
  - type: web
    name: ras-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ras-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # NODE_ENV=production above makes npm skip devDependencies by default
      # (typescript, @types/*, prisma CLI) - all of which the build step needs
      # (tsc, prisma generate/migrate). Force npm to install them anyway; the
      # app's own runtime behavior is unaffected since NODE_ENV=production is
      # still set for the actual server process.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Set this to your live frontend URL, e.g. https://your-site.vercel.app
      # (no trailing slash). Comma-separate multiple origins if you add a
      # recruiter frontend later.
      - key: FRONTEND_ORIGINS
        sync: false
