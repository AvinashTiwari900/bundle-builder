databases:
  - name: ras-db
    plan: free
    region: oregon
    databaseName: ras
    user: ras

services:
  - type: web
    name: ras-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ras-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Set this after your Netlify site is live, e.g.
      # https://your-site-name.netlify.app (no trailing slash). Comma-separate
      # multiple origins if you add a recruiter frontend later.
      - key: FRONTEND_ORIGINS
        sync: false
